<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mozando Real Estate Management</title>
  <style>
    body {
      background: orange;
      text-align: center;
      font-family: Arial;
      padding: 30px;
      margin: 0;
    }
    h1 {
      color: purple;
      font-size: 28px;
    }
    p {
      color: #FFDAB9;
      text-align: center;
      font-size: 18px;
    }
    ul {
      text-align: left;
      display: inline-block;
      color: white;
      font-size: 16px;
    }
    .card {
      background: RoyalBlue;
      padding: 20px;
      margin: 20px auto;
      border-radius: 10px;
      width: 90%;
      max-width: 500px;
      color: white;
    }
    button {
      background: #FFDAB9;
      color: violet;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    input, textarea {
      width: 90%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>Hello 😊, this is Mozando Real Estate Management</h1>
  <p>We buy and sell properties (houses)</p>

  <ul>
    <li>We buy and sell properties</li>
    <li>We rent houses</li>
    <li>We sell affordable properties</li>
    <li>We are reliable</li>
  </ul>

  <div class="card">
    <h2>Get in touch with me</h2>
    <p>Need a property? Message me!</p>
    
    <form action="https://formspree.io/f/your-form-id" method="post">
      <input type="text" name="name" placeholder="your name" required>
      <input type="email" name="email" placeholder="your email" required>
      <textarea name="message" placeholder="how may i help you?" required></textarea>
      <button type="submit">Send message</button>
    </form>
  </div>

</body>
</html>
